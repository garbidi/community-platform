<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка · Вершина</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <link rel="icon" href="/static/logo-navy.svg">
</head>
<body>
<div class="poster">
  <div class="poster__brand">
    <img src="/static/logo-cream.svg" alt="vershina.community">
  </div>
  <div class="poster__form">
    {% if done %}
      <h1>Настройка уже пройдена</h1>
      <p class="trouble">Помощник настроен и работает. Входите логином
        и паролем, которые задали при настройке.</p>
      <a href="/login">Перейти ко входу</a>
    {% else %}
      <h1>Ссылка не подошла</h1>
      <p class="trouble">Настройка открывается по личной ссылке. Попросите
        её у того, кто ставил помощника.</p>
    {% endif %}
  </div>
</div>
</body>
</html>
